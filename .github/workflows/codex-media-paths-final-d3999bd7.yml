name: Datasets Arrow media paths final d3999bd7
on:
  push:
    branches:
      - validation/media-paths-final-d3999bd7
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arrow: ['24.0.0', '26.0.1']
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      RUN_REMOTE: 'no'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/datasets
          ref: a5999fa2837849dbbd28257f02c2c836d08b9bdf
          path: source
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: huggingface/datasets
          ref: 39fd698d619816099ffa8eb07b5c79b0f4f5f299
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert exact candidate SHA and tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a5999fa2837849dbbd28257f02c2c836d08b9bdf
          test "$(git rev-parse 'HEAD^{tree}')" = 18f0380515868b42cd46895098de1614c87f59ce
          git diff HEAD --exit-code
      - name: Install supported CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check -e './source[quality,pdfs,vision]' "pyarrow==${{ matrix.arrow }}" pytest pytest-xdist pytest-datadir setuptools
          python -m pip check
          python -m pip freeze --exclude-editable
      - name: Run the new media regression suite
        working-directory: source
        run: |
          python -c 'import datasets, pathlib, pyarrow; assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path.cwd()); print(datasets.__file__, pyarrow.__version__)'
          python -m pytest -rfExX -m 'not integration' -n 2 --dist loadfile -sv tests/features/test_arrow_media_paths.py
      - name: Compare the exact existing PDF failure against main
        working-directory: baseline
        run: |
          test "$(git rev-parse HEAD)" = 39fd698d619816099ffa8eb07b5c79b0f4f5f299
          test "$(git rev-parse 'HEAD^{tree}')" = 287bb9a68b195058f6d6f0293516832cfbcb6624
          export PYTHONPATH="$PWD/src"
          python -c 'import datasets, pathlib; assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path.cwd()); print(datasets.__file__)'
          set +e
          python -m pytest -rfExX -m 'not integration' -n 2 --dist loadfile -sv tests/features/test_pdf.py::test_dataset_with_pdf_feature --junitxml="$RUNNER_TEMP/pdf-base.xml"
          rc=$?
          set -e
          test "$rc" = 1
      - name: Report related tests and validate baseline parity
        working-directory: source
        run: |
          python -c 'import datasets, pathlib; assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path.cwd()); print(datasets.__file__)'
          set +e
          python -m pytest -rfExX -m 'not integration' -n 2 --dist loadfile -sv tests/features/test_audio.py tests/features/test_video.py tests/features/test_pdf.py tests/features/test_features.py --junitxml="$RUNNER_TEMP/media-head.xml"
          rc=$?
          set -e
          test "$rc" = 1
          python - <<'PY2'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          def inspect(name):
              report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / name)
              cases = report.findall(".//testcase")
              skipped = [c for c in cases if c.find("skipped") is not None]
              errors = [c for c in cases if c.find("error") is not None]
              failures = [c for c in cases if c.find("failure") is not None]
              assert len(failures) == 1 and not errors
              failure = failures[0]
              assert failure.attrib["name"] == "test_dataset_with_pdf_feature"
              diagnosis = failure.find("failure").text
              assert "assert isinstance(column, list)" in diagnosis
              assert "where False = isinstance(Column(" in diagnosis
              return len(cases) - len(skipped) - len(failures), len(skipped), len(failures)
          print("EXISTING_BASE", inspect("pdf-base.xml"))
          print("EXISTING_HEAD", inspect("media-head.xml"))
          PY2
      - name: Run independently authored chunked-array controls
        working-directory: source
        run: python ../.codex-validation/check-chunked-media-paths.py
      - name: Run repository quality target
        if: ${{ matrix.arrow == '26.0.1' }}
        working-directory: source
        run: make quality
      - name: Always verify candidate stayed clean
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a5999fa2837849dbbd28257f02c2c836d08b9bdf
          test "$(git rev-parse 'HEAD^{tree}')" = 18f0380515868b42cd46895098de1614c87f59ce
          git diff HEAD --exit-code
          git -C ../baseline diff HEAD --exit-code
