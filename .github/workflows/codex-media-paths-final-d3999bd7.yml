name: Datasets Arrow media paths final d3999bd7
on:
  push:
    branches:
      - validation/media-paths-final-d3999bd7
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        arrow: ['24.0.0', '26.0.1']
    env:
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      RUN_REMOTE: 'no'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/datasets
          ref: a5999fa2837849dbbd28257f02c2c836d08b9bdf
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert exact candidate SHA and tree
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a5999fa2837849dbbd28257f02c2c836d08b9bdf
          test "$(git rev-parse 'HEAD^{tree}')" = 18f0380515868b42cd46895098de1614c87f59ce
          git diff HEAD --exit-code
      - name: Install supported CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check -e './source[quality,pdfs,vision]' "pyarrow==${{ matrix.arrow }}" pytest pytest-xdist pytest-datadir setuptools
          python -m pip check
          python -m pip freeze --exclude-editable
      - name: Validate regression and existing feature suites
        working-directory: source
        run: |
          python -c 'import datasets, pathlib, pyarrow; assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path.cwd()); print(datasets.__file__, pyarrow.__version__)'
          python -m pytest -rfExX -m 'not integration' -n 2 --dist loadfile -sv tests/features/test_arrow_media_paths.py tests/features/test_audio.py tests/features/test_video.py tests/features/test_pdf.py tests/features/test_features.py
      - name: Run independently authored chunked-array controls
        working-directory: source
        run: python ../.codex-validation/check-chunked-media-paths.py
      - name: Run repository quality target
        if: ${{ matrix.arrow == '26.0.1' }}
        working-directory: source
        run: make quality
      - name: Always verify candidate stayed clean
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = a5999fa2837849dbbd28257f02c2c836d08b9bdf
          test "$(git rev-parse 'HEAD^{tree}')" = 18f0380515868b42cd46895098de1614c87f59ce
          git diff HEAD --exit-code
