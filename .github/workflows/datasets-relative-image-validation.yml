name: Datasets exact candidate secret range a48c97b8
on:
  push:
    branches: [validation-datasets-relative-image-a48c97b8]
permissions:
  contents: read
jobs:
  exact-range:
    name: Exact source commit range verified secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: e9cd09986aa4e5607e9ba0b6ceb8b9c2123b0a8d
      SOURCE_SHA: e5aaf58e3ce01958df9ffbe5a708c0a6099298ba
      SOURCE_TREE: f123b643bd1fede0dfcec9cc2a48a0067c0c59f8
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoldArowana/datasets
          ref: e5aaf58e3ce01958df9ffbe5a708c0a6099298ba
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate and source range
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/GoldArowana/datasets"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$SOURCE_SHA")" = 2
          git diff HEAD --exit-code
          git diff --name-only "$BASE_SHA" "$SOURCE_SHA"
          printf 'SOURCE_SECRET_RANGE base=%s head=%s tree=%s event=%s\n' "$BASE_SHA" "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA"
      - name: Scan the source commits with the inherited verified-secrets policy
        uses: trufflesecurity/trufflehog@6bd2d14f7a4bc1e569fa3550efa7ec632a4fa67b
        with:
          base: e9cd09986aa4e5607e9ba0b6ceb8b9c2123b0a8d
          head: e5aaf58e3ce01958df9ffbe5a708c0a6099298ba
          version: "3.99.8"
          extra_args: --results=verified
      - name: Always verify unchanged source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
