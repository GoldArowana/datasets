name: Datasets Arrow media paths baseline d3999bd7
on:
  push:
    branches:
      - validation/media-paths-base-d3999bd7
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: huggingface/datasets
          ref: 39fd698d619816099ffa8eb07b5c79b0f4f5f299
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assert exact upstream source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 39fd698d619816099ffa8eb07b5c79b0f4f5f299
          test "$(git rev-parse 'HEAD^{tree}')" = 287bb9a68b195058f6d6f0293516832cfbcb6624
          git diff HEAD --exit-code
      - name: Install published CPU dependencies for source and tests
        run: |
          python -m pip install --disable-pip-version-check -e './source[quality]' 'pyarrow==26.0.1' pytest pytest-xdist
          python -m pip check
          python -m pip freeze --exclude-editable
      - name: Reproduce with public Dataset.from_dict
        run: |
          python -c 'import datasets, pathlib, pyarrow; assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path("source").resolve()); print(datasets.__file__, pyarrow.__version__)'
          set +e
          python -m pytest -q --tb=short .codex-validation/test_arrow_media_paths.py --junitxml="$RUNNER_TEMP/media-base.xml"
          rc=$?
          set -e
          echo "pytest_exit=$rc"
          test "$rc" = 1
          python - <<'PY'
          import os
          from xml.etree import ElementTree
          cases = ElementTree.parse(os.path.join(os.environ["RUNNER_TEMP"], "media-base.xml")).findall(".//testcase")
          expected = {f"test_arrow_media_paths[{kind}-{feature}]" for kind in ("large", "view") for feature in ("audio", "video", "pdf")}
          failed = {case.attrib["name"] for case in cases if case.find("failure") is not None}
          errors = [case.attrib["name"] for case in cases if case.find("error") is not None]
          print(f"actual_cases={len(cases)} failed={sorted(failed)} errors={errors}")
          assert len(cases) == 9 and failed == expected and not errors
          PY
      - name: Always verify source integrity
        if: always()
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 39fd698d619816099ffa8eb07b5c79b0f4f5f299
          test "$(git rev-parse 'HEAD^{tree}')" = 287bb9a68b195058f6d6f0293516832cfbcb6624
          git diff HEAD --exit-code
